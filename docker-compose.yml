services:
  db:
    image: postgres:16-alpine
    container_name: cifrao-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cifrao
      POSTGRES_PASSWORD: cifrao
      POSTGRES_DB: cifrao
    # Host usa 55432 -> container 5432. As portas 5432/5433 do host já estão
    # ocupadas por um Postgres nativo; 55432 evita a colisão em dev.
    ports:
      - "55432:5432"
    volumes:
      - cifrao-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cifrao -d cifrao"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cifrao-pgdata:
